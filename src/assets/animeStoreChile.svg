  <!-- Texto principal -->
  <text x="200" y="95" font-family="Verdana, Geneva, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc">
    Anime Store
  </text>

  <!-- Texto secundario -->
  <text x="200" y="135" font-family="Verdana, Geneva, sans-serif" font-size="28" letter-spacing="3" fill="#38bdf8">
