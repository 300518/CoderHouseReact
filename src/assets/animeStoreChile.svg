<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="600" height="200" rx="20" fill="#0f172a"></rect>

  <!-- Círculo decorativo estilo sol anime -->
  <circle cx="110" cy="100" r="60" fill="#ef4444"></circle>
  <circle cx="110" cy="100" r="45" fill="#facc15"></circle>

  <!-- Estrella interior -->
